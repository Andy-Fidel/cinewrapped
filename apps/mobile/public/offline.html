<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0F19" />
    <title>CineWrapped · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f19;
        color: #f6f6f7;
        font:
          17px/1.6 system-ui,
          sans-serif;
      }
      main {
        padding: 32px;
        max-width: 440px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        color: #b8bcc6;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        color: white;
        background: #cf3044;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>
        Reconnect to open CineWrapped. Viewings already saved to the pending queue on this device
        can sync when you return to the app.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
