services:
  - type: keyvalue
    name: cinewrapped-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: cinewrapped-api
    repo: https://github.com/Andy-Fidel/cinewrapped.git
    branch: codex/sdk54-expo-go
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    preDeployCommand: sh infrastructure/scripts/render-predeploy.sh
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: CORS_ORIGINS
        value: https://cinewrapped-web.onrender.com,https://cinewrapped-admin.onrender.com
      - key: API_DOCS_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: PRISMA_CONNECTION_LIMIT
        value: '5'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cinewrapped-cache
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TMDB_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        generateValue: true

  - type: web
    name: cinewrapped-web
    repo: https://github.com/Andy-Fidel/cinewrapped.git
    branch: codex/sdk54-expo-go
    runtime: static
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --filter @cinewrapped/mobile... --frozen-lockfile --trust-lockfile --network-concurrency=4 --fetch-retries=5 --fetch-timeout=120000 && pnpm --filter @cinewrapped/mobile build:web
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://cinewrapped-api.onrender.com/api/v1
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_EAS_PROJECT_ID
        value: de90dff5-a2f1-445c-9aa0-4493c6287f13
