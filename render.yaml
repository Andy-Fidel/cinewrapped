services:
  - type: keyvalue
    name: cinewrapped-cache
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: cinewrapped-api
    repo: https://github.com/Andy-Fidel/cinewrapped.git
    branch: codex/sdk54-expo-go
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./infrastructure/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: CORS_ORIGINS
        value: https://cinewrapped-api.onrender.com,http://localhost:8081,http://127.0.0.1:8081
      - key: API_DOCS_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cinewrapped-cache
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TMDB_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: PUSH_TOKEN_ENCRYPTION_KEY
        generateValue: true
