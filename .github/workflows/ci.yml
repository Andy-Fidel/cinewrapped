name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinewrapped_test
          POSTGRES_USER: cinewrapped
          POSTGRES_PASSWORD: cinewrapped
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinewrapped -d cinewrapped_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      DATABASE_URL: postgresql://cinewrapped:cinewrapped@localhost:5432/cinewrapped_test?schema=public
      TEST_DATABASE_URL: postgresql://cinewrapped:cinewrapped@localhost:5432/cinewrapped_test?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-test-key-at-least-sixteen-characters
      EXPO_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: public-test-key-at-least-sixteen-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Prepare integration database roles
        run: pnpm --filter @cinewrapped/database db:test:bootstrap

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed integration database
        run: pnpm db:seed

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test, including PostgreSQL integration tests
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Build
        run: pnpm build
