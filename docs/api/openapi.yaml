        content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
      }
    Created:
      {
        description: Resource created.,
        headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } },
        content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
      }
    Accepted:
      {
        description: Request accepted for asynchronous processing.,
        headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } },
        content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } },
      }
    Collection:
      {
        description: Cursor-paginated collection.,
        headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' } },
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } },
      }
    Health:
      {
        description: Process health.,
        content: { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } },
      }
    NoContent: { description: Operation completed with no response body. }
    BadRequest:
      {
        description: Invalid request.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Unauthorized:
      {
        description: Authentication required or invalid.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Forbidden:
      {
        description: Actor is not permitted.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    NotFound:
      {
        description: Resource absent or concealed.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Conflict:
      {
        description: 'State, version, uniqueness, or idempotency conflict.',
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    Gone:
      {
        description: Resource expired or permanently erased.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    PayloadTooLarge:
      {
        description: Payload exceeds configured maximum.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    UnsupportedMediaType:
      {
        description: MIME type is not allowed.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    ValidationError:
      {
        description: Domain validation failed.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    RateLimited:
      {
        description: Rate limit exceeded.,
        headers: { Retry-After: { schema: { type: integer } } },
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }
    ServiceUnavailable:
      {
        description: Required dependency unavailable.,
        content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
      }

  headers:
    RequestId:
      {
        description: Correlation identifier.,
        schema: { type: string, minLength: 8, maxLength: 100 },
      }

  schemas:
    Uuid: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    MediaType: { type: string, enum: [MOVIE, TV] }
    WatchStatus: { type: string, enum: [PLANNED, WATCHING, COMPLETED, PAUSED, DROPPED, REWATCHING] }
    Visibility: { type: string, enum: [PUBLIC, FRIENDS, PRIVATE, CLUB_ONLY] }
    WrapType: { type: string, enum: [WEEKLY, MONTHLY, YEARLY, CUSTOM] }
    WrapStatus: { type: string, enum: [PENDING, GENERATING, COMPLETED, FAILED] }
    RecommendationType:
      {
        type: string,
        enum:
          [
            PERSONALIZED,
            TRENDING,
            FRIEND_BASED,
            MOOD_BASED,
            SIMILAR_MEDIA,
            HIDDEN_GEM,
            CONTINUE_WATCHING,
            BECAUSE_YOU_WATCHED,
          ],
      }
    RequestMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties: { requestId: { type: string } }
    PageMeta:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore, limit]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 50 }
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { oneOf: [{ type: object }, { type: array, items: {} }, { type: 'null' }] }
        meta: { $ref: '#/components/schemas/RequestMeta' }
    CollectionEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: { type: array, items: { type: object } }
        meta:
          allOf:
            - { $ref: '#/components/schemas/RequestMeta' }
            - type: object
              required: [page]
              properties: { page: { $ref: '#/components/schemas/PageMeta' } }
    ErrorObject:
      type: object
      additionalProperties: false
      required: [code, message, details, requestId]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]+$' }
        message: { type: string, minLength: 1, maxLength: 500 }
        details: { type: [object, 'null'], additionalProperties: true }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { const: false }
        error: { $ref: '#/components/schemas/ErrorObject' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        version: { type: string }

    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [timezone, locale]
      properties:
        timezone: { type: string, minLength: 1, maxLength: 64 }
        locale: { type: string, minLength: 2, maxLength: 16 }
        installationId: { type: string, minLength: 1, maxLength: 255 }
    RevokeOtherSessionsRequest:
      type: object
      additionalProperties: false
      required: [keepCurrent]
      properties: { keepCurrent: { type: boolean, const: true } }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[A-Za-z0-9_]+$' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: [string, 'null'], maxLength: 500 }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        preferredLanguage: { type: string, minLength: 2, maxLength: 16 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        dateOfBirth: { type: [string, 'null'], format: date }
        profileVisibility: { type: string, enum: [PUBLIC, FRIENDS, PRIVATE] }
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        preferredGenreIds:
          { type: array, uniqueItems: true, maxItems: 50, items: { type: string, format: uuid } }
        dislikedGenreIds:
          { type: array, uniqueItems: true, maxItems: 50, items: { type: string, format: uuid } }
        preferredLanguages:
          { type: array, uniqueItems: true, maxItems: 30, items: { type: string, maxLength: 16 } }
        preferredCountries:
          {
            type: array,
            uniqueItems: true,
            maxItems: 30,
            items: { type: string, pattern: '^[A-Z]{2}$' },
          }
        preferredDecades:
          {
            type: array,
            uniqueItems: true,
            maxItems: 20,
            items: { type: integer, multipleOf: 10, minimum: 1880, maximum: 2200 },
          }
        preferredRuntimeMin: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        preferredRuntimeMax: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        preferredRatingSystem: { type: string, enum: [FIVE_STAR, TEN_POINT, LIKE_DISLIKE] }
        contentTypes:
          {
            type: array,
            uniqueItems: true,
            minItems: 1,
            items: { type: string, enum: [MOVIE, TV, ANIME, DOCUMENTARY, SHORT_FILM] },
          }
        spoilerPreference: { type: string, enum: [ALWAYS_HIDE, HIDE_UNTIL_REVEALED, SHOW] }
        adultContentEnabled: { type: boolean }
        theme: { type: string, enum: [SYSTEM, LIGHT, DARK] }
        defaultCountryForStreaming: { type: string, pattern: '^[A-Z]{2}$' }
        autoplayTrailers: { type: boolean }
        reduceMotion: { type: boolean }
        mainstreamPreferencePercent: { type: integer, minimum: 0, maximum: 100 }
    UpdatePrivacyRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        watchHistoryVisibility: { $ref: '#/components/schemas/Visibility' }
        ratingsVisibility: { $ref: '#/components/schemas/Visibility' }
        reviewsVisibility: { $ref: '#/components/schemas/Visibility' }
        listsVisibility: { $ref: '#/components/schemas/Visibility' }
        friendListVisibility: { $ref: '#/components/schemas/Visibility' }
        wrapsVisibility: { $ref: '#/components/schemas/Visibility' }
        onlineStatusVisibility: { $ref: '#/components/schemas/Visibility' }
        shareWatchActivity: { type: boolean }
        shareRatingActivity: { type: boolean }
        shareReviewActivity: { type: boolean }
        shareListActivity: { type: boolean }
        shareAchievementActivity: { type: boolean }
        leaderboardVisibility: { $ref: '#/components/schemas/Visibility' }
        passportVisibility: { $ref: '#/components/schemas/Visibility' }
    UpdateOnboardingRequest:
      type: object
      additionalProperties: false
      required: [step, data]
      properties:
        step:
          {
            type: string,
            enum:
              [
                PROFILE,
                CONTENT_TYPES,
                GENRES,
                FAVORITES,
                DISLIKES,
                STREAMING,
                RECOMMENDATIONS,
                SOCIAL,
                NOTIFICATIONS,
              ],
          }
        data: { type: object, additionalProperties: true }
    CompleteOnboardingRequest:
      type: object
      additionalProperties: false
      required: [acceptedPrivacyVersion, acceptedTermsVersion, expectedProfileVersion]
      properties:
        acceptedPrivacyVersion: { type: string, minLength: 1, maxLength: 40 }
        acceptedTermsVersion: { type: string, minLength: 1, maxLength: 40 }
        expectedProfileVersion: { type: integer, minimum: 1 }
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, mimeType, sizeBytes, checksumSha256]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        checksumSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [format, categories]
      properties:
        format: { type: string, enum: [JSON, CSV_ZIP] }
        categories:
          {
            type: array,
            uniqueItems: true,
            minItems: 1,
            items:
              {
                type: string,
                enum:
                  [
                    PROFILE,
                    PREFERENCES,
                    WATCH_HISTORY,
                    RATINGS,
                    REVIEWS,
                    WATCHLISTS,
                    SOCIAL,
                    WRAPS,
                  ],
              },
          }
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation, revokeImmediately]
      properties:
        confirmation: { type: string, const: DELETE MY ACCOUNT }
        revokeImmediately: { type: boolean, const: true }
        reasonCode: { type: string, maxLength: 80 }

    UpsertWatchHistoryRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/WatchStatus' }
        progressPercent: { type: number, minimum: 0, maximum: 100 }
        progressSeconds: { type: [integer, 'null'], minimum: 0 }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        lastWatchedAt: { type: [string, 'null'], format: date-time }
        expectedVersion: { type: integer, minimum: 1 }
    CreateViewingRequest:
      type: object
      additionalProperties: false
      required: [clientOperationId, watchedAt, isRewatch]
      properties:
