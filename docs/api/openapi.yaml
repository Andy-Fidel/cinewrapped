          metric,
          target,
          points,
          startsAt,
          endsAt,
          joined,
          progress,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        metric: { $ref: '#/components/schemas/GamificationMetric' }
        target: { type: integer, minimum: 1 }
        points: { type: integer, minimum: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        joined: { type: boolean }
        progress: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
    StreakSummary:
      type: object
      additionalProperties: false
      required: [currentDays, longestDays, lastActiveDate, timezone]
      properties:
        currentDays: { type: integer, minimum: 0 }
        longestDays: { type: integer, minimum: 0 }
        lastActiveDate: { type: [string, 'null'], format: date }
        timezone: { type: string }
    PassportStamp:
      type: object
      additionalProperties: false
      required: [countryCode, viewingCount, uniqueTitles, firstVisitedAt, lastVisitedAt]
      properties:
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        viewingCount: { type: integer, minimum: 1 }
        uniqueTitles: { type: integer, minimum: 1 }
        firstVisitedAt: { type: string, format: date-time }
        lastVisitedAt: { type: string, format: date-time }
    MoviePassport:
      type: object
      additionalProperties: false
      required: [countriesVisited, languagesExplored, decadesExplored, totalStamps, stamps]
      properties:
        countriesVisited: { type: integer, minimum: 0 }
        languagesExplored: { type: integer, minimum: 0 }
        decadesExplored: { type: integer, minimum: 0 }
        totalStamps: { type: integer, minimum: 0 }
        stamps: { type: array, items: { $ref: '#/components/schemas/PassportStamp' } }
    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, user, score, isViewer]
      properties:
        rank: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/UserSummary' }
        score: { type: integer, minimum: 0 }
        isViewer: { type: boolean }
    LeaderboardSummary:
      type: object
      additionalProperties: false
      required: [metric, visibilityNote, entries, viewerEntry]
      properties:
        metric: { type: string, enum: [POINTS, VIEWINGS, STREAK] }
        visibilityNote: { type: string }
        entries: { type: array, items: { $ref: '#/components/schemas/LeaderboardEntry' } }
        viewerEntry:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/LeaderboardEntry' }
    GamificationDashboard:
      type: object
      additionalProperties: false
      required:
        [totalPoints, unlockedCount, achievementCount, achievements, challenges, streak, passport]
      properties:
        totalPoints: { type: integer, minimum: 0 }
        unlockedCount: { type: integer, minimum: 0 }
        achievementCount: { type: integer, minimum: 0 }
        achievements: { type: array, items: { $ref: '#/components/schemas/AchievementSummary' } }
        challenges: { type: array, items: { $ref: '#/components/schemas/ChallengeSummary' } }
        streak: { $ref: '#/components/schemas/StreakSummary' }
        passport: { $ref: '#/components/schemas/MoviePassport' }
