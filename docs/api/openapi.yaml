openapi: 3.1.0
info:
  title: CineWrapped API
  version: 1.0.0
  summary: Versioned REST contract for the CineWrapped MVP
  description: >-
    Product API consumed by CineWrapped mobile and admin clients. Supabase Auth
    issues identity sessions; this API owns application authorization and data.
  contact:
    name: CineWrapped Engineering
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://api.staging.cinewrapped.example/api/v1
    description: Staging
  - url: https://api.cinewrapped.example/api/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - { name: System, description: 'Process health and readiness.' }
  - { name: Auth, description: 'Identity bridge and session management.' }
  - { name: Users, description: 'Profiles, preferences, privacy, export, and deletion.' }
  - { name: Onboarding, description: 'Incremental onboarding state and completion.' }
  - { name: Media, description: 'Discovery and normalized media metadata.' }
  - { name: Tracking, description: 'Current watch state, viewings, and episode progress.' }
  - { name: Watchlists, description: 'Member watchlists and items.' }
  - { name: Ratings, description: 'Member title ratings.' }
  - { name: Reviews, description: 'Review draft and publication lifecycle.' }
  - { name: Recommendations, description: 'Explainable recommendations and feedback.' }
  - {
      name: Social,
      description: 'Profiles, follows, friendships, feed, shares, and safety controls.',
    }
  - { name: Comments, description: 'Review and feed discussion threads.' }
  - { name: Reactions, description: 'Idempotent social reactions.' }
  - { name: Statistics, description: 'Data-driven member viewing statistics.' }
  - { name: Wraps, description: 'Period wrap generation, retrieval, and sharing.' }
  - {
      name: Gamification,
      description: 'Achievements, challenges, streaks, privacy-safe leaderboards, and passports.',
    }
  - { name: Clubs, description: 'Membership, discussions, polls, group lists, and watch events.' }
  - { name: Notifications, description: 'In-app notifications and push device registration.' }

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/bootstrap:
    post:
      tags: [Auth]
      operationId: bootstrapCurrentUser
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Bootstrap' }
      x-response-dto: BootstrapResponse
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '201': { $ref: '#/components/responses/Created' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      x-response-dto: SessionSummaryPage
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/sessions/revoke-others:
    post:
      tags: [Auth]
      operationId: revokeOtherSessions
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/RevokeOthers' }
      x-response-dto: RevocationSummary
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      x-response-dto: CurrentUser
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      requestBody: { $ref: '#/components/requestBodies/UpdateProfile' }
      x-response-dto: CurrentUser
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      operationId: requestAccountDeletion
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/DeleteAccount' }
      x-response-dto: DeletionRequest
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/preferences:
    get:
      tags: [Users]
      operationId: getPreferences
      x-response-dto: UserPreferences
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [Users]
      operationId: updatePreferences
      requestBody: { $ref: '#/components/requestBodies/UpdatePreferences' }
      x-response-dto: UserPreferences
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/privacy:
    get:
      tags: [Users]
      operationId: getPrivacySettings
      x-response-dto: PrivacySettings
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [Users]
      operationId: updatePrivacySettings
      requestBody: { $ref: '#/components/requestBodies/UpdatePrivacy' }
      x-response-dto: PrivacySettings
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/onboarding:
    get:
      tags: [Onboarding]
      operationId: getOnboardingState
      x-response-dto: OnboardingState
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [Onboarding]
      operationId: updateOnboardingState
      requestBody: { $ref: '#/components/requestBodies/UpdateOnboarding' }
      x-response-dto: OnboardingState
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/onboarding/complete:
    post:
      tags: [Onboarding]
      operationId: completeOnboarding
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CompleteOnboarding' }
      x-response-dto: CurrentUser
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/me/avatar-upload:
    post:
      tags: [Users]
      operationId: createAvatarUpload
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateUpload' }
      x-response-dto: UploadIntent
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /users/me/export:
    post:
      tags: [Users]
      operationId: createAccountExport
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateExport' }
      x-response-dto: ExportJob
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/export/{exportId}:
    get:
      tags: [Users]
      operationId: getAccountExport
      parameters: [{ $ref: '#/components/parameters/ExportId' }]
      x-response-dto: ExportJob
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /users:
    get:
      tags: [Users]
      operationId: searchUsers
      parameters:
        - { $ref: '#/components/parameters/UserQuery' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: UserSummaryPage
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /users/{username}:
    get:
      tags: [Users]
      operationId: getUserProfile
      parameters: [{ $ref: '#/components/parameters/Username' }]
      x-response-dto: PublicProfile
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{username}/activity:
    get:
      tags: [Social]
      operationId: getUserActivity
      parameters:
        [
          { $ref: '#/components/parameters/Username' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: FeedActivityPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /users/{username}/reviews:
    get:
      tags: [Reviews]
      operationId: getUserReviews
      parameters:
        [
          { $ref: '#/components/parameters/Username' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: ReviewSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /users/{username}/followers:
    get:
      tags: [Social]
      operationId: getUserFollowers
      parameters:
        [
          { $ref: '#/components/parameters/Username' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: UserSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /users/{username}/following:
    get:
      tags: [Social]
      operationId: getUserFollowing
      parameters:
        [
          { $ref: '#/components/parameters/Username' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: UserSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /users/{username}/compatibility:
    get:
      tags: [Social]
      operationId: getUserCompatibility
      parameters: [{ $ref: '#/components/parameters/Username' }]
      x-response-dto: CompatibilitySummary
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }

  /genres:
    get:
      tags: [Media]
      operationId: listGenres
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: language, in: query, schema: { type: string, maxLength: 16 } }
      x-response-dto: GenreList
      responses: { '200': { $ref: '#/components/responses/Collection' } }
  /streaming-providers:
    get:
      tags: [Media]
      operationId: listStreamingProviders
      parameters: [{ $ref: '#/components/parameters/CountryCode' }]
      x-response-dto: StreamingProviderList
      responses: { '200': { $ref: '#/components/responses/Collection' } }
  /search/media:
    get:
      tags: [Media]
      operationId: searchMedia
      parameters:
        - { $ref: '#/components/parameters/MediaQuery' }
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - {
            name: genreIds,
            in: query,
            schema: { type: array, items: { type: string, format: uuid }, maxItems: 20 },
          }
        - { name: releaseYear, in: query, schema: { type: integer, minimum: 1870, maximum: 2200 } }
        - { name: runtimeMin, in: query, schema: { type: integer, minimum: 1, maximum: 1440 } }
        - { name: runtimeMax, in: query, schema: { type: integer, minimum: 1, maximum: 1440 } }
        - { name: unwatchedOnly, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: MediaSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '400': { $ref: '#/components/responses/BadRequest' },
          '429': { $ref: '#/components/responses/RateLimited' },
        }
  /media/trending:
    get:
      tags: [Media]
      operationId: getTrendingMedia
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: window, in: query, required: true, schema: { type: string, enum: [DAY, WEEK] } }
        - { $ref: '#/components/parameters/CountryCode' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: MediaSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '503': { $ref: '#/components/responses/ServiceUnavailable' },
        }
  /media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMediaDetails
      parameters:
        - { $ref: '#/components/parameters/MediaId' }
        - {
            name: include,
            in: query,
            schema:
              {
                type: array,
                items: { type: string, enum: [credits, streamingAvailability] },
                maxItems: 2,
              },
          }
      x-response-dto: MediaDetails
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /media/{mediaId}/credits:
    get:
      tags: [Media]
      operationId: getMediaCredits
      parameters:
        - { $ref: '#/components/parameters/MediaId' }
        - { name: type, in: query, schema: { type: string, enum: [CAST, CREW] } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: CreditPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /media/{mediaId}/streaming-availability:
    get:
      tags: [Media]
      operationId: getStreamingAvailability
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/RequiredCountryCode' },
        ]
      x-response-dto: StreamingAvailability
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /media/{mediaId}/similar:
    get:
      tags: [Media]
      operationId: getSimilarMedia
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: MediaSummaryPage
      responses:
        {
          '200': { $ref: '#/components/responses/Collection' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /media/{mediaId}/seasons/{seasonNumber}:
    get:
      tags: [Media]
      operationId: getSeasonDetails
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/SeasonNumber' },
        ]
      x-response-dto: SeasonDetails
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /media/{mediaId}/seasons/{seasonNumber}/episodes/{episodeNumber}:
    get:
      tags: [Media]
      operationId: getEpisodeDetails
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/SeasonNumber' },
          { $ref: '#/components/parameters/EpisodeNumber' },
        ]
      x-response-dto: EpisodeDetails
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }

  /watch-history:
    get:
      tags: [Tracking]
      operationId: listWatchHistory
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WatchStatus' } }
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: WatchHistoryPage
      responses: { '200': { $ref: '#/components/responses/Collection' } }
  /watch-history/{mediaId}:
    get:
      tags: [Tracking]
      operationId: getWatchHistoryEntry
      parameters: [{ $ref: '#/components/parameters/MediaId' }]
      x-response-dto: WatchHistoryEntry
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
    put:
      tags: [Tracking]
      operationId: upsertWatchHistoryEntry
      parameters: [{ $ref: '#/components/parameters/MediaId' }]
      requestBody: { $ref: '#/components/requestBodies/UpsertWatchHistory' }
      x-response-dto: WatchHistoryEntry
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '201': { $ref: '#/components/responses/Created' },
          '409': { $ref: '#/components/responses/Conflict' },
          '422': { $ref: '#/components/responses/ValidationError' },
        }
    delete:
      tags: [Tracking]
      operationId: deleteWatchHistoryEntry
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/ExpectedVersionQuery' },
        ]
      responses:
        {
          '204': { $ref: '#/components/responses/NoContent' },
          '404': { $ref: '#/components/responses/NotFound' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /watch-history/{mediaId}/viewings:
    get:
      tags: [Tracking]
      operationId: listViewings
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: ViewingPage
      responses: { '200': { $ref: '#/components/responses/Collection' } }
    post:
      tags: [Tracking]
      operationId: createViewing
      parameters:
        [
          { $ref: '#/components/parameters/MediaId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/CreateViewing' }
      x-response-dto: Viewing
      responses:
        {
          '201': { $ref: '#/components/responses/Created' },
          '409': { $ref: '#/components/responses/Conflict' },
          '422': { $ref: '#/components/responses/ValidationError' },
        }
  /viewings/{viewingId}:
    patch:
      tags: [Tracking]
      operationId: updateViewing
      parameters: [{ $ref: '#/components/parameters/ViewingId' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateViewing' }
      x-response-dto: Viewing
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
    delete:
      tags: [Tracking]
      operationId: deleteViewing
      parameters:
        [
          { $ref: '#/components/parameters/ViewingId' },
          { $ref: '#/components/parameters/ExpectedVersionQuery' },
        ]
      responses:
        {
          '204': { $ref: '#/components/responses/NoContent' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
  /watch-history/{mediaId}/episodes:
    get:
      tags: [Tracking]
      operationId: listEpisodeProgress
      parameters:
        - { $ref: '#/components/parameters/MediaId' }
        - { name: seasonNumber, in: query, schema: { type: integer, minimum: 0 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      x-response-dto: EpisodeProgressPage
      responses: { '200': { $ref: '#/components/responses/Collection' } }
  /watch-history/{mediaId}/episodes/{episodeId}:
    put:
      tags: [Tracking]
      operationId: upsertEpisodeProgress
      parameters:
        [{ $ref: '#/components/parameters/MediaId' }, { $ref: '#/components/parameters/EpisodeId' }]
      requestBody: { $ref: '#/components/requestBodies/UpsertEpisodeProgress' }
      x-response-dto: EpisodeProgress
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '201': { $ref: '#/components/responses/Created' },
          '409': { $ref: '#/components/responses/Conflict' },
        }

  /watchlists:
    get:
      tags: [Watchlists]
      operationId: listWatchlists
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      x-response-dto: WatchlistSummaryPage
      responses: { '200': { $ref: '#/components/responses/Collection' } }
    post:
      tags: [Watchlists]
      operationId: createWatchlist
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/CreateWatchlist' }
      x-response-dto: Watchlist
      responses:
        {
          '201': { $ref: '#/components/responses/Created' },
          '422': { $ref: '#/components/responses/ValidationError' },
        }
  /watchlists/{watchlistId}:
    get:
      tags: [Watchlists]
      operationId: getWatchlist
      parameters:
        [
          { $ref: '#/components/parameters/WatchlistId' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      x-response-dto: Watchlist
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '404': { $ref: '#/components/responses/NotFound' },
        }
    patch:
      tags: [Watchlists]
      operationId: updateWatchlist
      parameters: [{ $ref: '#/components/parameters/WatchlistId' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateWatchlist' }
      x-response-dto: Watchlist
      responses:
        {
          '200': { $ref: '#/components/responses/Ok' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
    delete:
      tags: [Watchlists]
      operationId: deleteWatchlist
      parameters:
        [
          { $ref: '#/components/parameters/WatchlistId' },
          { $ref: '#/components/parameters/ExpectedVersionQuery' },
        ]
      responses:
        {
          '204': { $ref: '#/components/responses/NoContent' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /watchlists/{watchlistId}/items:
    post:
      tags: [Watchlists]
      operationId: addWatchlistItem
      parameters:
        [
          { $ref: '#/components/parameters/WatchlistId' },
          { $ref: '#/components/parameters/IdempotencyKey' },
        ]
      requestBody: { $ref: '#/components/requestBodies/AddWatchlistItem' }
      x-response-dto: WatchlistItem
      responses:
        {
          '201': { $ref: '#/components/responses/Created' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /watchlists/{watchlistId}/items/{itemId}:
    patch:
      tags: [Watchlists]
      operationId: updateWatchlistItem
      parameters:
        [
          { $ref: '#/components/parameters/WatchlistId' },
          { $ref: '#/components/parameters/ItemId' },
        ]
